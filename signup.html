<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<style>
  .login-shell {
    max-width: 500px;
    margin: 0 auto;
    padding: 44px 24px 0;
    text-align: center;
  }

  .login-icon {
    font-size: 34px;
    display: inline-block;
    animation: excitedBounce 1s ease-in-out infinite;
  }
  @keyframes excitedBounce {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-8px) rotate(6deg); }
  }

  .login-headline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--excel-green-deep);
    min-height: 50px;
    margin-top: 8px;
    opacity: 0;
    transform: translateY(10px);
    animation: headlineIn 0.5s ease 0.2s forwards;
  }
  @keyframes headlineIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-wrap {
    position: relative;
    max-width: 400px;
    margin: 24px auto 60px;
  }

  .auth-glow {
    position: absolute;
    inset: -30px;
    z-index: 0;
    pointer-events: none;
    overflow: visible;
  }
  .auth-glow::before, .auth-glow::after {
    content: '';
    position: absolute;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    filter: blur(50px);
    opacity: 0.35;
    animation: glowDrift 6s ease-in-out infinite;
  }
  .auth-glow::before {
    background: var(--excel-green);
    top: -40px;
    left: -60px;
  }
  .auth-glow::after {
    background: var(--amber);
    bottom: -40px;
    right: -60px;
    animation-delay: 3s;
  }
  @keyframes glowDrift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(15px, -15px) scale(1.15); }
  }

  .auth-box {
    background: var(--cell-bg);
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    padding: 32px;
    opacity: 0;
    transform: translateY(24px) scale(0.97);
    animation: authBoxIn 0.6s cubic-bezier(.34,1.56,.64,1) 0.15s forwards;
    position: relative;
    z-index: 1;
  }
  @keyframes authBoxIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .auth-box h1 { font-size: 20px; margin: 0 0 20px; }
  .auth-box label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  .auth-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  .auth-box button {
    width: 100%;
    margin-top: 24px;
  }
  #message {
    margin-top: 16px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #message.error { color: #B3261E; }
  #message.success { color: var(--excel-green-deep); }
  .switch-link { margin-top: 18px; font-size: 13px; text-align: center; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--ink-soft);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--grid-line);
  }
  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--grid-line);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-google:hover { border-color: var(--ink-soft); }
  .btn-google svg { width: 18px; height: 18px; }

  @media (max-width: 820px) {
    .auth-glow { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="login.html">Log In</a>
    </nav>
  </div>
</div>

<div class="login-shell">
  <span class="login-icon">🚀</span>
  <div class="login-headline" id="loginHeadline"></div>
</div>

<div class="auth-wrap">
  <div class="auth-glow"></div>

  <div class="auth-box">
    <h1>Create your free account</h1>

    <button class="btn-google" id="googleSignupBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c2.8 0 5.3 1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5 0 9.5-1.9 12.9-5l-6-5c-1.9 1.3-4.3 2-6.9 2-5.3 0-9.7-3.6-11.3-8.4l-6.6 5C9.5 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6 5C40.5 35.5 43.5 30.2 43.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Your name">

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 6 characters">

    <button class="btn btn-primary" id="signupBtn">Sign Up</button>

    <div id="message"></div>

    <div class="switch-link">Already have an account? <a href="login.html">Log in</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const signupLines = [
    "Your Excel journey starts right here.",
    "Free to start. Real spreadsheet. No catch.",
    "Join and start building real skill today.",
    "This is where job-ready Excel begins.",
    "Sign up — your future self will thank you.",
    "One account, 116 formulas, zero excuses.",
    "Start practicing in the next two minutes.",
    "Your data career starts with one formula.",
    "Skip the theory. Get straight to practice.",
    "Build the skill that gets you noticed.",
    "Every expert started exactly where you are.",
    "Create your account and open a real sheet."
  ];
  document.getElementById('loginHeadline').textContent =
    signupLines[Math.floor(Math.random() * signupLines.length)];

  document.getElementById('googleSignupBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
  });

  document.getElementById('signupBtn').addEventListener('click', async () => {
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    if (!name || !email || !password) {
      msg.textContent = 'Please fill in all fields.';
      msg.className = 'error';
      return;
    }

    const { data, error } = await supabaseClient.auth.signUp({ email, password });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    // Create the matching profile row
    if (data.user) {
      await supabaseClient.from('profiles').insert({
        id: data.user.id,
        name: name,
        email: email
      });
    }

    msg.textContent = 'Account created! Check your email to confirm, then log in.';
    msg.className = 'success';
  });
</script>

</body>
</html>
