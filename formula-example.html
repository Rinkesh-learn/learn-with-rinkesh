<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="practice-styles.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <span id="navAuthArea"></span>
    </nav>
  </div>
</div>

<div class="hero" style="padding-bottom:10px;">
  <div class="nav-quicklinks-strip" id="quickLinksRow" style="margin-bottom:12px;">
    <a href="excel-guide.html" data-page="excel-guide.html">📘 About Excel</a>
    <a href="shortcuts.html" data-page="shortcuts.html">⌨️ Shortcuts</a>
    <a href="formula-example.html" data-page="formula-example.html">📖 All Formulas</a>
    <a href="interview-prep.html" data-page="interview-prep.html">🎯 Interview Prep</a>
  </div>
  <h1 style="font-size:32px;">The formula reference.</h1>
  <p class="lede" style="margin-bottom:14px;">Browse by category. Click any formula to see how it works and jump straight into practicing it.</p>
  <a href="shortcuts.html" style="display:inline-block; font-family:'IBM Plex Mono',monospace; font-size:13px; font-weight:600; color:var(--excel-green-deep); text-decoration:none; border-bottom:2px solid var(--amber);">⌨️ View all keyboard shortcuts &rarr;</a>
</div>

<div class="sheet" id="formulaCategories" style="margin-top:10px;"></div>

<footer>
  Learn With Rinkesh — built one cell at a time.
</footer>

<script src="formulas-data.js"></script>
<script>
  const categories = {};
  FORMULA_META.forEach(f => {
    if (!categories[f.category]) categories[f.category] = [];
    categories[f.category].push(f);
  });

  const container = document.getElementById('formulaCategories');
  CATEGORY_ORDER.forEach(cat => {
    if (!categories[cat]) return;
    const section = document.createElement('div');
    section.style.marginBottom = '36px';
    section.innerHTML = `
      <div class="sheet-header">
        <span class="colletter">${CATEGORY_ICONS[cat] || ''}</span>
        <h2>${cat}</h2>
      </div>
      <div class="formula-card-grid">
        ${categories[cat].map(f => `
          <a class="formula-card" href="practice.html?formula=${f.id}">
            <div class="formula-card-name">${f.name}${PRACTICE_ENABLED_IDS.includes(f.id) ? ' <span class="practice-dot" title="Graded practice available"></span>' : ''}</div>
            <div class="formula-card-desc">${f.description}</div>
            <div class="formula-card-cta">${PRACTICE_ENABLED_IDS.includes(f.id) ? 'Practice this' : 'Try it freely'} &rarr;</div>
          </a>
        `).join('')}
      </div>
    `;
    container.appendChild(section);
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="auth-nav.js"></script>
<script>
  (function() {
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('#quickLinksRow a').forEach(a => {
      if (a.dataset.page === currentPage) {
        a.style.transition = 'opacity 0.3s ease, max-width 0.3s ease, margin 0.3s ease, padding 0.3s ease';
        a.style.opacity = '0';
        a.style.maxWidth = '0';
        a.style.margin = '0';
        a.style.padding = '0';
        a.style.overflow = 'hidden';
        a.style.pointerEvents = 'none';
      }
    });
  })();
</script>

</body>
</html>
