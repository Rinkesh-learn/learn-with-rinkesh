<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="feedback-widget.css">
<link rel="stylesheet" href="chat-widget.css">
<style>
  .auth-box {
    max-width: 400px;
    margin: 64px auto;
    background: var(--cell-bg);
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    padding: 32px;
  }
  .auth-box h1 { font-size: 20px; margin: 0 0 20px; }
  .auth-box label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  .auth-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  .auth-box button {
    width: 100%;
    margin-top: 24px;
  }
  #message {
    margin-top: 16px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #message.error { color: #B3261E; }
  #message.success { color: var(--excel-green-deep); }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
  </div>
</div>

<div class="auth-box">
  <h1>Set a new password</h1>

  <label for="password">New password</label>
  <input type="password" id="password" placeholder="At least 6 characters">

  <label for="confirmPassword">Confirm new password</label>
  <input type="password" id="confirmPassword" placeholder="Re-type the password">

  <button class="btn btn-primary" id="updateBtn">Update Password</button>

  <div id="message"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="feedback-widget.js"></script>
<script src="chat-widget.js"></script>
<script>
  document.getElementById('updateBtn').addEventListener('click', async () => {
    const password = document.getElementById('password').value;
    const confirmPassword = document.getElementById('confirmPassword').value;
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    if (!password || password.length < 6) {
      msg.textContent = 'Password must be at least 6 characters.';
      msg.className = 'error';
      return;
    }
    if (password !== confirmPassword) {
      msg.textContent = "Passwords don't match — check both fields.";
      msg.className = 'error';
      return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Password updated! Redirecting to log in...';
    msg.className = 'success';
    setTimeout(() => { window.location.href = 'login.html'; }, 1500);
  });
</script>

<script src="scoring.js"></script>
<script src="leaderboard-widget.js"></script>
<script src="site-name.js"></script>

</body>
</html>
