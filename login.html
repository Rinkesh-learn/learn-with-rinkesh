<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<style>
  .auth-box {
    max-width: 400px;
    margin: 64px auto;
    background: var(--cell-bg);
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    padding: 32px;
  }
  .auth-box h1 { font-size: 20px; margin: 0 0 20px; }
  .auth-box label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  .auth-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  .auth-box button {
    width: 100%;
    margin-top: 24px;
  }
  #message {
    margin-top: 16px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #message.error { color: #B3261E; }
  #message.success { color: var(--excel-green-deep); }
  .switch-link { margin-top: 18px; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="formula-example.html">Formulas</a>
      <a href="about.html">About</a>
      <a href="signup.html">Sign Up</a>
    </nav>
  </div>
</div>

<div class="auth-box">
  <h1>Log in</h1>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Your password">

  <button class="btn btn-primary" id="loginBtn">Log In</button>

  <div id="message"></div>

  <div class="switch-link">New here? <a href="signup.html">Create an account</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Logged in! Redirecting...';
    msg.className = 'success';
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  });
</script>

</body>
</html>
