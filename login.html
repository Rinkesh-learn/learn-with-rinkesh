<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="feedback-widget.css">
<link rel="stylesheet" href="chat-widget.css">
<style>
  .login-shell {
    max-width: 500px;
    margin: 0 auto;
    padding: 16px 24px 0;
    text-align: center;
  }

  .login-icon {
    font-size: 24px;
    display: inline-block;
    animation: excitedBounce 1s ease-in-out infinite;
  }
  @keyframes excitedBounce {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-8px) rotate(6deg); }
  }

  .login-headline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 14px;
    font-weight: 700;
    color: var(--excel-green-deep);
    min-height: 20px;
    margin-top: 4px;
    opacity: 0;
    transform: translateY(10px);
    animation: headlineIn 0.5s ease 0.2s forwards;
  }
  @keyframes headlineIn {
    to { opacity: 1; transform: translateY(0); }
  }

  .auth-wrap {
    position: relative;
    max-width: 400px;
    margin: 14px auto 30px;
  }

  .auth-box {
    background: var(--cell-bg);
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    padding: 26px 28px;
    opacity: 0;
    transform: translateY(24px) scale(0.97);
    animation: authBoxIn 0.6s cubic-bezier(.34,1.56,.64,1) 0.15s forwards;
    position: relative;
    z-index: 1;
  }
  @keyframes authBoxIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .auth-box h1 { font-size: 18px; margin: 0 0 14px; }
  .auth-box label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 4px;
    margin-top: 10px;
  }
  .auth-box input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  .auth-box button {
    width: 100%;
    margin-top: 16px;
  }
  #message {
    margin-top: 10px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #message.error { color: #B3261E; }
  #message.success { color: var(--excel-green-deep); }
  .switch-link { margin-top: 12px; font-size: 13px; text-align: center; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 14px 0;
    color: var(--ink-soft);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--grid-line);
  }
  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--grid-line);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-google:hover { border-color: var(--ink-soft); }
  .btn-google svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="login.html" class="active">Log In</a>
    </nav>
  </div>
</div>

<div class="login-shell">
  <span class="login-icon">🎉</span>
  <div class="login-headline" id="loginHeadline"></div>
</div>

<div class="auth-wrap">
  <div class="auth-box">
    <h1>Log in</h1>

    <button class="btn-google" id="googleLoginBtn">
      <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c2.8 0 5.3 1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5 0 9.5-1.9 12.9-5l-6-5c-1.9 1.3-4.3 2-6.9 2-5.3 0-9.7-3.6-11.3-8.4l-6.6 5C9.5 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6 5C40.5 35.5 43.5 30.2 43.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="divider">or</div>

    <label for="email">Email</label>
    <input type="email" id="email" placeholder="you@example.com">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Your password">

    <button class="btn btn-primary" id="loginBtn">Log In</button>

    <div id="message"></div>

    <div class="switch-link"><a href="forgot-password.html">Forgot password?</a></div>
    <div class="switch-link">New here? <a href="signup.html">Create an account</a></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="feedback-widget.js"></script>
<script src="chat-widget.js"></script>
<script>
  const loginLines = [
    "You're one step back from leveling up.",
    "Ready to pick up right where you left off?",
    "Every login gets you closer to job-ready.",
    "Let's turn practice into progress.",
    "Consistency beats cramming — welcome back.",
    "Small daily reps build real Excel skill.",
    "Your next formula win starts here.",
    "Log in and keep the streak alive.",
    "Skill up. One cell at a time.",
    "Come back stronger than yesterday.",
    "Excel mastery is closer than you think.",
    "Your spreadsheet is right where you left it."
  ];
  // One random line per page load — stays fixed until the page is refreshed
  document.getElementById('loginHeadline').textContent =
    loginLines[Math.floor(Math.random() * loginLines.length)];

  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Logged in! Redirecting...';
    msg.className = 'success';
    const redirectTo = new URLSearchParams(window.location.search).get('redirect');
    setTimeout(() => { window.location.href = (redirectTo && !redirectTo.includes('://')) ? redirectTo : 'index.html'; }, 1000);
  });
</script>

<script src="site-name.js"></script>

</body>
</html>
