<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<style>
  .login-shell {
    max-width: 500px;
    margin: 0 auto;
    padding: 44px 24px 0;
    text-align: center;
  }

  .login-icon {
    font-size: 34px;
    display: inline-block;
    animation: excitedBounce 1s ease-in-out infinite;
  }
  @keyframes excitedBounce {
    0%, 100% { transform: translateY(0) rotate(-6deg); }
    50% { transform: translateY(-8px) rotate(6deg); }
  }

  .login-headline {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    color: var(--excel-green-deep);
    min-height: 50px;
    margin-top: 8px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .login-headline.show { opacity: 1; transform: translateY(0); }

  .auth-box {
    max-width: 400px;
    margin: 24px auto 0;
    background: var(--cell-bg);
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    padding: 32px;
    opacity: 0;
    transform: translateY(24px) scale(0.97);
    animation: authBoxIn 0.6s cubic-bezier(.34,1.56,.64,1) 0.15s forwards;
  }
  @keyframes authBoxIn {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .auth-box h1 { font-size: 20px; margin: 0 0 20px; }
  .auth-box label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  .auth-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  .auth-box button {
    width: 100%;
    margin-top: 24px;
  }
  #message {
    margin-top: 16px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #message.error { color: #B3261E; }
  #message.success { color: var(--excel-green-deep); }
  .switch-link { margin-top: 18px; font-size: 13px; text-align: center; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--ink-soft);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--grid-line);
  }
  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--grid-line);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-google:hover { border-color: var(--ink-soft); }
  .btn-google svg { width: 18px; height: 18px; }

  /* ---------- Band scene below the login box ---------- */

  .band-scene {
    max-width: 700px;
    height: 150px;
    margin: 10px auto 40px;
    position: relative;
    overflow: hidden;
  }

  .band-char {
    position: absolute;
    bottom: 0;
    width: 110px;
    height: 130px;
  }

  .char-drum-kid { left: 50%; margin-left: -140px; animation: walkInLeft 2.2s ease-out forwards; }
  .char-trumpet-kid { left: 50%; margin-left: 30px; animation: walkInRight 2.2s ease-out forwards; }
  .char-dog { left: 50%; margin-left: -35px; width: 90px; animation: walkInRight 2.6s ease-out 0.5s forwards; opacity: 0; }

  @keyframes walkInLeft {
    from { transform: translateX(-260px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }
  @keyframes walkInRight {
    from { transform: translateX(260px); opacity: 0; }
    to { transform: translateX(0); opacity: 1; }
  }

  .bounce-group { animation: idleBounce 0.55s ease-in-out infinite; transform-origin: bottom center; }
  @keyframes idleBounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .drumstick { animation: drumHit 0.55s ease-in-out infinite; transform-box: fill-box; transform-origin: bottom right; }
  @keyframes drumHit {
    0%, 100% { transform: rotate(-25deg); }
    50% { transform: rotate(10deg); }
  }

  .trumpet-cheek { animation: cheekPuff 0.55s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes cheekPuff {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.25); }
  }

  .dog-tail { animation: tailWag 0.4s ease-in-out infinite; transform-box: fill-box; transform-origin: left center; }
  @keyframes tailWag {
    0%, 100% { transform: rotate(-15deg); }
    50% { transform: rotate(20deg); }
  }
</style>
</head>
<body>

    <nav class="mainnav">

    Continue with Google
  </button>

  <div class="divider">or</div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Your password">

  <button class="btn btn-primary" id="loginBtn">Log In</button>

  <div id="message"></div>

  <div class="switch-link"><a href="forgot-password.html">Forgot password?</a></div>
  <div class="switch-link">New here? <a href="signup.html">Create an account</a></div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  const loginLines = [
    "You're one step back from leveling up.",
    "Ready to pick up right where you left off?",
    "Every login gets you closer to job-ready.",
    "Let's turn practice into progress.",
    "Consistency beats cramming — welcome back.",
    "Small daily reps build real Excel skill.",
    "Your next formula win starts here.",
    "Log in and keep the streak alive.",
    "Skill up. One cell at a time.",
    "Come back stronger than yesterday.",
    "Excel mastery is closer than you think.",
    "Your spreadsheet is right where you left it."
  ];
  let loginLineIdx = 0;
  const headlineEl = document.getElementById('loginHeadline');

  function cycleHeadline() {
    headlineEl.classList.remove('show');
    setTimeout(() => {
      headlineEl.textContent = loginLines[loginLineIdx];
      headlineEl.classList.add('show');
      loginLineIdx = (loginLineIdx + 1) % loginLines.length;
    }, 300);
  }
  cycleHeadline();
  setInterval(cycleHeadline, 3200);

  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Logged in! Redirecting...';
    msg.className = 'success';
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  });
</script>

</body>
</html>
