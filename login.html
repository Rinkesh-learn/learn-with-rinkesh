<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log In — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<style>
  .auth-box {
    max-width: 400px;
    margin: 64px auto;
    background: var(--cell-bg);
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    padding: 32px;
  }
  .auth-box h1 { font-size: 20px; margin: 0 0 20px; }
  .auth-box label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
    margin-top: 16px;
  }
  .auth-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  .auth-box button {
    width: 100%;
    margin-top: 24px;
  }
  #message {
    margin-top: 16px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #message.error { color: #B3261E; }
  #message.success { color: var(--excel-green-deep); }
  .switch-link { margin-top: 18px; font-size: 13px; text-align: center; }
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0;
    color: var(--ink-soft);
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--grid-line);
  }
  .btn-google {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    border: 1px solid var(--grid-line);
    color: var(--ink);
    padding: 10px 16px;
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
  }
  .btn-google:hover { border-color: var(--ink-soft); }
  .btn-google svg { width: 18px; height: 18px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="formula-example.html">Formulas</a>
      <a href="about.html">About</a>
      <a href="signup.html">Sign Up</a>
    </nav>
  </div>
</div>

<div class="auth-box">
  <h1>Log in</h1>

  <button class="btn-google" id="googleLoginBtn">
    <svg viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.4 29.3 35 24 35c-6.1 0-11-4.9-11-11s4.9-11 11-11c2.8 0 5.3 1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5 13.2 4.5 4.5 13.2 4.5 24S13.2 43.5 24 43.5 43.5 34.8 43.5 24c0-1.2-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 16 18.9 13 24 13c2.8 0 5.3 1 7.3 2.8l5.7-5.7C33.6 6.5 29 4.5 24 4.5c-7.7 0-14.3 4.4-17.7 10.2z"/><path fill="#4CAF50" d="M24 43.5c5 0 9.5-1.9 12.9-5l-6-5c-1.9 1.3-4.3 2-6.9 2-5.3 0-9.7-3.6-11.3-8.4l-6.6 5C9.5 39 16.2 43.5 24 43.5z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.3 5.5l6 5C40.5 35.5 43.5 30.2 43.5 24c0-1.2-.1-2.4-.4-3.5z"/></svg>
    Continue with Google
  </button>

  <div class="divider">or</div>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com">

  <label for="password">Password</label>
  <input type="password" id="password" placeholder="Your password">

  <button class="btn btn-primary" id="loginBtn">Log In</button>

  <div id="message"></div>

  <div class="switch-link"><a href="forgot-password.html">Forgot password?</a></div>
  <div class="switch-link">New here? <a href="signup.html">Create an account</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script>
  document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    await supabaseClient.auth.signInWithOAuth({ provider: 'google' });
  });

  document.getElementById('loginBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Logged in! Redirecting...';
    msg.className = 'success';
    setTimeout(() => { window.location.href = 'index.html'; }, 1000);
  });
</script>

</body>
</html>
