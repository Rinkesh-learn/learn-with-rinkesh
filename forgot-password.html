<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="feedback-widget.css">
<link rel="stylesheet" href="chat-widget.css">
<style>
  .auth-box {
    max-width: 400px;
    margin: 64px auto;
    background: var(--cell-bg);
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    padding: 32px;
  }
  .auth-box h1 { font-size: 20px; margin: 0 0 10px; }
  .auth-box p.hint { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; }
  .auth-box label {
    display: block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .auth-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--grid-line);
    border-radius: var(--radius);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
  }
  .auth-box button {
    width: 100%;
    margin-top: 20px;
  }
  #message {
    margin-top: 16px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
  }
  #message.error { color: #B3261E; }
  #message.success { color: var(--excel-green-deep); }
  .switch-link { margin-top: 18px; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <a href="login.html">Log In</a>
    </nav>
  </div>
</div>

<div class="auth-box">
  <h1>Reset your password</h1>
  <p class="hint">Enter the email you signed up with — we'll send you a link to set a new password.</p>

  <label for="email">Email</label>
  <input type="email" id="email" placeholder="you@example.com">

  <button class="btn btn-primary" id="resetBtn">Send Reset Link</button>

  <div id="message"></div>

  <div class="switch-link">Remembered it? <a href="login.html">Back to log in</a></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="feedback-widget.js"></script>
<script src="chat-widget.js"></script>
<script>
  document.getElementById('resetBtn').addEventListener('click', async () => {
    const email = document.getElementById('email').value.trim();
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    if (!email) {
      msg.textContent = 'Please enter your email.';
      msg.className = 'error';
      return;
    }

    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: window.location.origin + '/update-password.html'
    });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Reset link sent! Check your email.';
    msg.className = 'success';
  });
</script>

<script src="site-name.js"></script>

</body>
</html>
