<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="feedback-widget.css">
<link rel="stylesheet" href="chat-widget.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <span id="navAuthArea"></span>
    </nav>
  </div>
</div>

<div class="setup-box">
  <h1>Account Settings</h1>
  <p class="hint">Update your profile details anytime.</p>

  <label for="avatarPreview">Profile photo</label>
  <div style="display:flex; align-items:center; gap:14px; margin-bottom:6px;">
    <span class="nav-avatar-initial" id="avatarPreview" style="width:52px; height:52px; font-size:20px;"></span>
    <div>
      <input type="file" id="avatarFile" accept="image/*" style="display:none;">
      <button type="button" class="btn btn-ghost" id="avatarUploadBtn">Upload Photo</button>
      <div id="avatarUploadStatus" style="font-size:12px; color:var(--ink-soft); margin-top:4px;"></div>
    </div>
  </div>

  <label for="name">Name</label>
  <input type="text" id="name">

  <label for="username">Username</label>
  <input type="text" id="username" placeholder="e.g. rinkesh_shah">

  <label for="email">Email</label>
  <input type="email" id="email" disabled>

  <label for="age">Age</label>
  <input type="number" id="age">

  <label for="profession">Which describes you best?</label>
  <select id="profession">
    <option value="">Select one</option>
    <option value="Student">Student</option>
    <option value="Job Seeker">Job Seeker</option>
    <option value="Working Professional">Working Professional</option>
    <option value="Freelancer">Freelancer</option>
    <option value="Other">Other</option>
  </select>

  <label for="goal">Main goal</label>
  <select id="goal">
    <option value="">Select one</option>
    <option value="Interview Prep">Preparing for interviews</option>
    <option value="Job Skill">Getting better at my current job</option>
    <option value="Career Switch">Switching careers into data</option>
    <option value="Certification">Getting a certificate</option>
    <option value="General Learning">Just learning Excel generally</option>
  </select>

  <button class="btn btn-primary" id="saveBtn">Save Changes</button>

  <div id="message"></div>
</div>

<div class="setup-box">
  <h1>Chat Preferences</h1>
  <p class="hint">Controls how you appear in the community chat.</p>

  <label for="chatDisplayName">Chat display name</label>
  <input type="text" id="chatDisplayName" placeholder="How you appear in chat">

  <label style="display:flex; align-items:center; gap:8px; margin-top:14px;">
    <input type="checkbox" id="chatHideNameCheckbox" style="width:auto;">
    Hide my name in chat (show as "Anonymous")
  </label>

  <button class="btn btn-primary" id="chatPrefsBtn" style="width:100%; margin-top:16px;">Save Chat Preferences</button>

  <div id="chatPrefsMessage"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="feedback-widget.js"></script>
<script src="chat-widget.js"></script>
<script src="auth-nav.js"></script>
<script>
  let currentAvatarUrl = '';

  function refreshAvatarPreview() {
    const preview = document.getElementById('avatarPreview');
    if (currentAvatarUrl) {
      preview.style.background = `url('${currentAvatarUrl}') center/cover`;
      preview.style.color = 'transparent';
      preview.textContent = '';
    } else {
      const name = document.getElementById('name').value || 'U';
      preview.style.background = 'var(--excel-green)';
      preview.style.color = '#fff';
      preview.textContent = name.charAt(0).toUpperCase();
    }
  }

  async function loadAccount() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', session.user.id)
      .maybeSingle();

    document.getElementById('email').value = session.user.email;
    if (profile) {
      document.getElementById('name').value = profile.name || '';
      document.getElementById('username').value = profile.username || '';
      currentAvatarUrl = profile.avatar_url || '';
      document.getElementById('age').value = profile.age || '';
      document.getElementById('profession').value = profile.profession || '';
      document.getElementById('goal').value = profile.goal || '';
      document.getElementById('chatDisplayName').value = profile.chat_display_name || '';
      document.getElementById('chatHideNameCheckbox').checked = !!profile.chat_hide_name;
    }
    refreshAvatarPreview();
  }

  loadAccount();

  document.getElementById('name').addEventListener('input', refreshAvatarPreview);

  document.getElementById('avatarUploadBtn').addEventListener('click', () => {
    document.getElementById('avatarFile').click();
  });

  document.getElementById('avatarFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const status = document.getElementById('avatarUploadStatus');
    status.textContent = 'Uploading...';

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;

    const fileName = `${session.user.id}_${Date.now()}_${file.name}`;

    const { error: uploadError } = await supabaseClient.storage
      .from('avatars')
      .upload(fileName, file, { upsert: true });

    if (uploadError) {
      status.textContent = 'Upload failed: ' + uploadError.message;
      return;
    }

    const { data } = supabaseClient.storage.from('avatars').getPublicUrl(fileName);
    currentAvatarUrl = data.publicUrl;
    refreshAvatarPreview();
    status.textContent = 'Photo updated — click Save Changes to confirm.';
  });

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;

    const { error } = await supabaseClient.from('profiles').update({
      name: document.getElementById('name').value,
      username: document.getElementById('username').value,
      avatar_url: currentAvatarUrl || null,
      age: document.getElementById('age').value ? parseInt(document.getElementById('age').value) : null,
      profession: document.getElementById('profession').value,
      goal: document.getElementById('goal').value
    }).eq('id', session.user.id);

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Saved!';
    msg.className = 'success';
  });

  document.getElementById('chatPrefsBtn').addEventListener('click', async () => {
    const msg = document.getElementById('chatPrefsMessage');
    msg.className = '';
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;

    const { error } = await supabaseClient.from('profiles').update({
      chat_display_name: document.getElementById('chatDisplayName').value.trim() || null,
      chat_hide_name: document.getElementById('chatHideNameCheckbox').checked
    }).eq('id', session.user.id);

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }
    msg.textContent = 'Saved!';
    msg.className = 'success';
  });
</script>

<script src="site-name.js"></script>

</body>
</html>
