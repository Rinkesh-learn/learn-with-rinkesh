<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Account Settings — Learn With Rinkesh</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="feedback-widget.css">
</head>
<body>

<div class="topbar">
  <div class="topbar-inner">
    <a href="index.html" class="brand">
      <span class="namebox">A1</span>
      Learn With Rinkesh
    </a>
    <nav class="mainnav">
      <a href="index.html">Home</a>
      <a href="about.html">About</a>
      <span id="navAuthArea"></span>
    </nav>
  </div>
</div>

<div class="setup-box">
  <h1>Account Settings</h1>
  <p class="hint">Update your profile details anytime.</p>

  <label for="avatarPreview">Profile photo</label>
  <div style="display:flex; align-items:center; gap:14px; margin-bottom:6px;">
    <span class="nav-avatar-initial" id="avatarPreview" style="width:52px; height:52px; font-size:20px;"></span>
    <input type="text" id="avatarUrl" placeholder="Paste an image URL" style="flex:1;">
  </div>

  <label for="name">Name</label>
  <input type="text" id="name">

  <label for="username">Username</label>
  <input type="text" id="username" placeholder="e.g. rinkesh_shah">

  <label for="email">Email</label>
  <input type="email" id="email" disabled>

  <label for="age">Age</label>
  <input type="number" id="age">

  <label for="profession">Which describes you best?</label>
  <select id="profession">
    <option value="">Select one</option>
    <option value="Student">Student</option>
    <option value="Job Seeker">Job Seeker</option>
    <option value="Working Professional">Working Professional</option>
    <option value="Freelancer">Freelancer</option>
    <option value="Other">Other</option>
  </select>

  <label for="goal">Main goal</label>
  <select id="goal">
    <option value="">Select one</option>
    <option value="Interview Prep">Preparing for interviews</option>
    <option value="Job Skill">Getting better at my current job</option>
    <option value="Career Switch">Switching careers into data</option>
    <option value="Certification">Getting a certificate</option>
    <option value="General Learning">Just learning Excel generally</option>
  </select>

  <button class="btn btn-primary" id="saveBtn">Save Changes</button>

  <div id="message"></div>
</div>

<div class="setup-box">
  <h1>Change Password</h1>
  <p class="hint">Only applies if you signed up with email/password — Google accounts manage their password through Google.</p>

  <label for="newPassword">New password</label>
  <input type="password" id="newPassword" placeholder="At least 6 characters">

  <button class="btn btn-primary" id="passwordBtn">Update Password</button>

  <div id="passwordMessage"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="feedback-widget.js"></script>
<script src="auth-nav.js"></script>
<script>
  function refreshAvatarPreview() {
    const url = document.getElementById('avatarUrl').value.trim();
    const preview = document.getElementById('avatarPreview');
    if (url) {
      preview.style.backgroundImage = `url('${url}')`;
      preview.style.backgroundSize = 'cover';
      preview.style.backgroundPosition = 'center';
      preview.style.background = `url('${url}') center/cover`;
      preview.style.color = 'transparent';
      preview.textContent = '';
    } else {
      const name = document.getElementById('name').value || 'U';
      preview.style.background = 'var(--excel-green)';
      preview.style.color = '#fff';
      preview.textContent = name.charAt(0).toUpperCase();
    }
  }

  async function loadAccount() {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) {
      window.location.href = 'login.html';
      return;
    }

    const { data: profile } = await supabaseClient
      .from('profiles')
      .select('*')
      .eq('id', session.user.id)
      .maybeSingle();

    document.getElementById('email').value = session.user.email;
    if (profile) {
      document.getElementById('name').value = profile.name || '';
      document.getElementById('username').value = profile.username || '';
      document.getElementById('avatarUrl').value = profile.avatar_url || '';
      document.getElementById('age').value = profile.age || '';
      document.getElementById('profession').value = profile.profession || '';
      document.getElementById('goal').value = profile.goal || '';
    }
    refreshAvatarPreview();
  }

  loadAccount();

  document.getElementById('avatarUrl').addEventListener('input', refreshAvatarPreview);
  document.getElementById('name').addEventListener('input', refreshAvatarPreview);

  document.getElementById('saveBtn').addEventListener('click', async () => {
    const msg = document.getElementById('message');
    msg.textContent = '';
    msg.className = '';

    const { data: { session } } = await supabaseClient.auth.getSession();
    if (!session) return;

    const { error } = await supabaseClient.from('profiles').update({
      name: document.getElementById('name').value,
      username: document.getElementById('username').value,
      avatar_url: document.getElementById('avatarUrl').value || null,
      age: document.getElementById('age').value ? parseInt(document.getElementById('age').value) : null,
      profession: document.getElementById('profession').value,
      goal: document.getElementById('goal').value
    }).eq('id', session.user.id);

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Saved!';
    msg.className = 'success';
  });

  document.getElementById('passwordBtn').addEventListener('click', async () => {
    const msg = document.getElementById('passwordMessage');
    msg.className = '';
    const newPassword = document.getElementById('newPassword').value;

    if (!newPassword || newPassword.length < 6) {
      msg.textContent = 'Password must be at least 6 characters.';
      msg.className = 'error';
      return;
    }

    const { error } = await supabaseClient.auth.updateUser({ password: newPassword });

    if (error) {
      msg.textContent = error.message;
      msg.className = 'error';
      return;
    }

    msg.textContent = 'Password updated!';
    msg.className = 'success';
    document.getElementById('newPassword').value = '';
  });
</script>

</body>
</html>
